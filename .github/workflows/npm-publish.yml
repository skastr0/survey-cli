name: Publish npm packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      - name: Inspect package contents
        run: bun run pack:dry-run

      - name: Publish packages
        run: |
          set -euo pipefail

          for package_dir in \
            packages/npm/survey-darwin-arm64 \
            packages/npm/survey-darwin-x64 \
            packages/npm/survey-linux-arm64 \
            packages/npm/survey-linux-x64 \
            packages/npm/survey
          do
            package_name="$(node -p "require('./${package_dir}/package.json').name")"
            package_version="$(node -p "require('./${package_dir}/package.json').version")"

            if npm view "${package_name}@${package_version}" version --prefer-online >/dev/null 2>&1; then
              echo "Skipping ${package_name}@${package_version}; already published"
              continue
            fi

            echo "Publishing ${package_name}@${package_version} from ${package_dir}"
            npm publish "./${package_dir}" --access public
          done
